server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reflex has no client-side router today (navigation is all in-app
    # state), but this fallback is the correct default for any Vite/React
    # SPA and costs nothing to include now.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}